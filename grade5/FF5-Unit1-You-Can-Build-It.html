<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddy's Adventure — Unit 1: You Can Build It!</title>
<!-- ============================================================
  FAMILY AND FRIENDS 5 — FLIPPED CLASSROOM LESSON
  Unit 1: You can build it!  (Builder Village)
  One self-contained file: HTML + CSS + JS.
  Teacher: Ms. Khanh Huyen  ·  AI Companion: Buddy
  ------------------------------------------------------------
  HOW TO EDIT:
  · Vocabulary  -> const WORDS
  · Story       -> const SCENES
  · Grammar     -> const GRAMMAR_STEPS
  · Practice    -> const PRACTICE
  · Challenge   -> renderChallenge()
  · Padlet link -> const PADLET_URL
============================================================= -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,500;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>
/* ================= DESIGN TOKENS ================= */
:root{
  --blue:#4DB8FF; --blue-deep:#1E88E5; --blue-ink:#0F5FA8;
  --sky:#C9EBFF;  --sky-soft:#EAF7FF;
  --sun:#FFE082;  --tangerine:#FFB74D; --orange-deep:#F49B2C;
  --ink:#2B3A5C;  --ink-soft:#5B6B8C;
  --mint:#4CC98A; --mint-deep:#2FA968;
  --coral:#FF8080; --coral-deep:#E85D5D;
  --purple:#B39DFF;
  --card:rgba(255,255,255,.82);
  --glass:rgba(255,255,255,.55);
  --shadow:0 12px 32px rgba(31,90,148,.16);
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --display:'Baloo 2',cursive; --body:'Nunito',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:var(--body); color:var(--ink);
  background:linear-gradient(180deg,#BFE6FF 0%,#E4F5FF 45%,#FFF6E0 100%);
  min-height:100dvh; overflow-x:hidden;
}
button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit}
img,svg{display:block}

/* ================= FLOATING BACKGROUND ================= */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.75;filter:blur(1px);animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:60%;height:160%;left:15%;top:-70%}
.cloud::after{width:45%;height:120%;right:12%;top:-45%}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.floaty{position:absolute;font-size:2rem;opacity:.22;animation:bob 6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}

/* ================= HEADER / HUD ================= */
#hud{
  position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:.6rem;
  padding:.55rem .9rem;
  background:rgba(255,255,255,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.8);
  box-shadow:0 4px 20px rgba(31,90,148,.08);
}
#hud .mini-buddy{width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#8FD3FF,#4DB8FF);display:grid;place-items:center;overflow:hidden;flex:0 0 auto;box-shadow:inset 0 -4px 8px rgba(0,0,0,.08)}
#hud .mini-buddy svg{width:38px;height:38px;margin-top:8px}
#hud .titles{flex:1;min-width:0}
#hud .titles h1{font-family:var(--display);font-size:1rem;line-height:1.1;color:var(--blue-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hud .titles small{font-size:.7rem;font-weight:700;color:var(--ink-soft)}
.xp-chip{
  display:flex;align-items:center;gap:.3rem;font-family:var(--display);font-weight:800;
  background:linear-gradient(135deg,var(--sun),var(--tangerine));color:#7A4A00;
  padding:.35rem .7rem;border-radius:999px;box-shadow:0 4px 12px rgba(244,155,44,.35);
  font-size:.9rem;position:relative;
}
.xp-chip.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-4deg)}100%{transform:scale(1)}}
#soundBtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:var(--shadow);font-size:1.1rem;transition:transform .2s}
#soundBtn:active{transform:scale(.9)}
#progressWrap{position:relative;height:10px;background:rgba(255,255,255,.7);border-radius:999px;margin:.5rem .9rem 0;overflow:hidden;box-shadow:inset 0 2px 4px rgba(31,90,148,.12)}
#progressBar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--mint),var(--blue));transition:width .8s cubic-bezier(.4,0,.2,1)}
#progressLabel{text-align:center;font-size:.68rem;font-weight:800;color:var(--ink-soft);margin:.2rem 0 0}

/* ================= STAGE / SCREENS ================= */
#stage{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:1rem 1rem 5rem}
.screen{animation:screenIn .55s cubic-bezier(.22,1,.36,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}

/* Buddy speech block */
.buddy-row{display:flex;align-items:flex-end;gap:.4rem;margin:.4rem 0 1rem}
.buddy-fig{width:118px;flex:0 0 auto;filter:drop-shadow(0 10px 14px rgba(31,90,148,.25));animation:buddyIn .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes buddyIn{from{opacity:0;transform:translateY(30px) scale(.7)}to{opacity:1;transform:none}}
.bubble{
  position:relative;flex:1;background:var(--card);backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,.9);border-radius:var(--r-md);border-bottom-left-radius:6px;
  padding:.8rem 1rem;box-shadow:var(--shadow);
  font-weight:700;font-size:1.02rem;line-height:1.45;
}
.bubble b{color:var(--blue-deep)}
.bubble .tiny{display:block;font-size:.78rem;font-weight:700;color:var(--ink-soft);margin-top:.3rem}

/* Cards */
.card{
  background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1.5px solid rgba(255,255,255,.9);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:1.2rem;margin-bottom:1rem;
}
h2.mission-title{font-family:var(--display);font-size:1.5rem;color:var(--blue-ink);display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem}
.eyebrow{display:inline-block;font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-deep));padding:.28rem .8rem;border-radius:999px;margin-bottom:.5rem;box-shadow:0 4px 10px rgba(30,136,229,.3)}
.eyebrow.orange{background:linear-gradient(135deg,var(--tangerine),var(--orange-deep));box-shadow:0 4px 10px rgba(244,155,44,.3)}
.eyebrow.mint{background:linear-gradient(135deg,var(--mint),var(--mint-deep));box-shadow:0 4px 10px rgba(47,169,104,.3)}
.eyebrow.purple{background:linear-gradient(135deg,var(--purple),#8F6FFF)}

/* Big buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  font-family:var(--display);font-weight:800;font-size:1.1rem;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));
  padding:.85rem 1.8rem;border-radius:999px;
  box-shadow:0 8px 20px rgba(30,136,229,.4),inset 0 -3px 0 rgba(0,0,0,.15);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
  min-height:52px;
}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.btn:active{transform:scale(.95)}
.btn.mint{background:linear-gradient(135deg,var(--mint),var(--mint-deep));box-shadow:0 8px 20px rgba(47,169,104,.4),inset 0 -3px 0 rgba(0,0,0,.15)}
.btn.sun{background:linear-gradient(135deg,var(--sun),var(--tangerine));color:#7A4A00;box-shadow:0 8px 20px rgba(244,155,44,.4),inset 0 -3px 0 rgba(0,0,0,.1)}
.btn.ghost{background:rgba(255,255,255,.85);color:var(--blue-deep);box-shadow:var(--shadow)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}

/* Option buttons (quiz) */
.opt{
  display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;
  background:rgba(255,255,255,.9);border:2.5px solid rgba(77,184,255,.35);
  border-radius:var(--r-md);padding:.85rem 1rem;margin:.45rem 0;
  font-weight:800;font-size:1.02rem;min-height:56px;
  transition:transform .15s,border-color .15s,background .2s;
}
.opt:hover{transform:translateX(4px);border-color:var(--blue)}
.opt .dot{width:30px;height:30px;flex:0 0 auto;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-family:var(--display);color:var(--blue-ink);font-size:.85rem}
.opt.correct{background:#E4FBEE;border-color:var(--mint);animation:pop .4s}
.opt.correct .dot{background:var(--mint);color:#fff}
.opt.wrong{background:#FFECEC;border-color:var(--coral);animation:shake .4s}
.opt.wrong .dot{background:var(--coral);color:#fff}
.opt.dim{opacity:.5;pointer-events:none}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.feedback{font-weight:800;border-radius:var(--r-sm);padding:.7rem 1rem;margin-top:.6rem;animation:pop .4s;display:flex;gap:.5rem;align-items:flex-start;line-height:1.35}
.feedback.good{background:#E4FBEE;color:var(--mint-deep)}
.feedback.retry{background:#FFF4E0;color:#B06A00}

/* Vocabulary cards */
.word-card{position:relative;overflow:hidden;text-align:center}
.word-art{width:130px;height:130px;margin:0 auto .4rem;border-radius:32px;background:linear-gradient(145deg,#fff, #E3F3FF);display:grid;place-items:center;box-shadow:inset 0 -6px 14px rgba(77,184,255,.18),0 8px 18px rgba(31,90,148,.12);animation:bob 4.5s ease-in-out infinite}
.word-art svg{width:92px;height:92px}
.word-title{font-family:var(--display);font-size:2rem;color:var(--blue-ink);line-height:1.1}
.word-phon{color:var(--ink-soft);font-weight:700;font-style:italic;margin-bottom:.4rem}
.speak-btn{
  display:inline-flex;align-items:center;gap:.4rem;font-family:var(--display);font-weight:800;
  background:linear-gradient(135deg,var(--sky),var(--blue));color:#fff;
  padding:.5rem 1.2rem;border-radius:999px;font-size:1rem;
  box-shadow:0 6px 14px rgba(77,184,255,.45);transition:transform .15s;min-height:44px;
}
.speak-btn:active{transform:scale(.92)}
.word-def{font-size:1.05rem;font-weight:700;margin:.7rem 0 .2rem}
.word-ex{background:rgba(255,224,130,.35);border-radius:var(--r-sm);padding:.6rem .9rem;font-weight:700;font-style:italic;margin-top:.5rem;border:1.5px dashed var(--tangerine)}
.word-count{font-family:var(--display);font-weight:800;color:var(--ink-soft);font-size:.8rem;letter-spacing:.1em}

/* Matching game */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:.6rem}
.match-tile{
  border-radius:var(--r-md);background:rgba(255,255,255,.92);border:2.5px solid rgba(77,184,255,.35);
  padding:.7rem;min-height:76px;display:grid;place-items:center;font-family:var(--display);
  font-weight:800;font-size:1.05rem;color:var(--blue-ink);transition:all .2s;text-align:center;
}
.match-tile svg{width:52px;height:52px}
.match-tile.sel{border-color:var(--tangerine);background:#FFF6DF;transform:scale(1.04)}
.match-tile.done{border-color:var(--mint);background:#E4FBEE;opacity:.6;pointer-events:none;transform:scale(.97)}
.match-tile.no{animation:shake .35s;border-color:var(--coral)}

/* Word order builder */
.chip-pool,.chip-answer{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0;min-height:54px}
.chip-answer{background:rgba(255,255,255,.7);border:2px dashed rgba(77,184,255,.5);border-radius:var(--r-md);padding:.5rem}
.word-chip{font-family:var(--display);font-weight:800;font-size:1.05rem;background:#fff;color:var(--blue-ink);border:2.5px solid var(--blue);border-radius:999px;padding:.5rem 1rem;box-shadow:0 4px 10px rgba(31,90,148,.15);transition:transform .15s;min-height:46px}
.word-chip:active{transform:scale(.92)}

/* Story */
.scene-art{font-size:3.2rem;text-align:center;padding:.6rem;background:linear-gradient(145deg,#FFF,#EAF7FF);border-radius:var(--r-md);margin-bottom:.7rem;letter-spacing:.2rem;box-shadow:inset 0 -6px 14px rgba(77,184,255,.15)}
.dialogue{margin:.4rem 0}
.line{display:flex;gap:.6rem;margin:.5rem 0;animation:screenIn .5s both}
.line .who{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:#fff;box-shadow:var(--shadow)}
.line .say{background:rgba(255,255,255,.92);border-radius:var(--r-md);border-top-left-radius:6px;padding:.55rem .85rem;font-weight:700;box-shadow:0 4px 12px rgba(31,90,148,.1)}
.line .say b{font-family:var(--display);color:var(--blue-deep);display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.line .say .hl{background:linear-gradient(transparent 55%,var(--sun) 55%);border-radius:4px;padding:0 2px;font-weight:800}

/* Grammar clues */
.clue{background:#FFF;border-left:6px solid var(--purple);border-radius:var(--r-sm);padding:.7rem .9rem;margin:.5rem 0;font-weight:800;font-size:1.05rem;box-shadow:0 4px 12px rgba(31,90,148,.1)}
.clue .glow{background:linear-gradient(transparent 55%,#E4D9FF 55%);padding:0 2px;border-radius:4px}
.rule-box{background:linear-gradient(145deg,#F3EEFF,#E9F5FF);border:2px solid var(--purple);border-radius:var(--r-md);padding:1rem;margin-top:.8rem;font-weight:800;text-align:center}
.rule-box .formula{font-family:var(--display);font-size:1.3rem;color:#6C4BD8;margin:.4rem 0}
.verb-table{display:grid;grid-template-columns:repeat(2,1fr);gap:.5rem;margin-top:.7rem}
.verb-pair{background:#fff;border-radius:var(--r-sm);padding:.5rem;text-align:center;font-weight:800;box-shadow:0 3px 8px rgba(31,90,148,.1)}
.verb-pair span{color:#6C4BD8}

/* Roadmap */
.map-list{position:relative;margin:.5rem 0 0;padding-left:8px}
.map-node{display:flex;align-items:center;gap:.9rem;position:relative;padding:.55rem 0}
.map-node::before{content:"";position:absolute;left:25px;top:52px;height:calc(100% - 40px);border-left:4px dotted rgba(77,184,255,.6)}
.map-node:last-child::before{display:none}
.map-badge{width:52px;height:52px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:1.4rem;background:#fff;box-shadow:var(--shadow);border:3px solid var(--sky);z-index:1;transition:all .3s}
.map-node.done .map-badge{background:linear-gradient(135deg,var(--mint),var(--mint-deep));border-color:#fff;color:#fff}
.map-node.now .map-badge{border-color:var(--tangerine);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,183,77,.55)}60%{box-shadow:0 0 0 14px rgba(255,183,77,0)}}
.map-info b{font-family:var(--display);font-size:1.05rem;color:var(--blue-ink)}
.map-info small{display:block;font-weight:700;color:var(--ink-soft)}
.map-node.now .map-info b{color:var(--orange-deep)}

/* Checklist */
.check-item{display:flex;align-items:center;gap:.8rem;background:rgba(255,255,255,.9);border-radius:var(--r-md);padding:.85rem 1rem;margin:.5rem 0;font-weight:800;font-size:1.05rem;cursor:pointer;border:2.5px solid transparent;transition:all .25s;min-height:56px}
.check-item .box{width:32px;height:32px;flex:0 0 auto;border-radius:10px;border:3px solid var(--blue);display:grid;place-items:center;color:#fff;font-size:1rem;transition:all .25s}
.check-item.on{border-color:var(--mint);background:#EDFBF3}
.check-item.on .box{background:var(--mint);border-color:var(--mint)}

/* Badges & stickers */
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.7rem;margin-top:.7rem}
.badge{background:rgba(255,255,255,.92);border-radius:var(--r-md);padding:.8rem .5rem;text-align:center;box-shadow:var(--shadow);animation:pop .5s both}
.badge .ico{font-size:2.2rem}
.badge b{font-family:var(--display);display:block;font-size:.85rem;color:var(--blue-ink);margin-top:.2rem}
.badge small{font-size:.68rem;font-weight:700;color:var(--ink-soft);line-height:1.2;display:block}
.badge.locked{filter:grayscale(1);opacity:.5}
.stars-big{font-size:3rem;text-align:center;letter-spacing:.4rem;margin:.4rem 0}
.stars-big span{display:inline-block;animation:starIn .6s cubic-bezier(.34,1.56,.64,1) both}
.stars-big span:nth-child(2){animation-delay:.25s}.stars-big span:nth-child(3){animation-delay:.5s}
@keyframes starIn{from{transform:scale(0) rotate(-120deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}

/* Adventure world map */
.world{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin-top:.7rem}
.stop{background:rgba(255,255,255,.9);border-radius:var(--r-md);padding:.6rem .3rem;text-align:center;font-weight:800;font-size:.72rem;color:var(--ink-soft);box-shadow:0 4px 12px rgba(31,90,148,.1)}
.stop .em{font-size:1.6rem;display:block}
.stop.now{outline:3px solid var(--tangerine);color:var(--orange-deep);animation:pulse 1.8s infinite}
.stop.lock{opacity:.45}

/* XP float */
.xp-float{position:fixed;z-index:200;font-family:var(--display);font-weight:800;color:var(--orange-deep);font-size:1.3rem;pointer-events:none;animation:xpUp 1.1s ease-out forwards;text-shadow:0 2px 0 #fff}
@keyframes xpUp{from{opacity:1;transform:translateY(0) scale(.8)}to{opacity:0;transform:translateY(-70px) scale(1.3)}}

/* Confetti canvas */
#confetti{position:fixed;inset:0;z-index:150;pointer-events:none}

/* Welcome hero */
.hero{text-align:center;padding:1.2rem 0 .4rem}
.hero .big-buddy{width:min(230px,58vw);margin:0 auto;filter:drop-shadow(0 16px 22px rgba(31,90,148,.3));animation:buddyIn .9s cubic-bezier(.34,1.56,.64,1)}
.hero h1{font-family:var(--display);font-size:clamp(1.7rem,6vw,2.5rem);color:var(--blue-ink);line-height:1.1;margin:.5rem 0 .2rem}
.hero h1 .accent{color:var(--orange-deep)}
.hero .sub{font-weight:800;color:var(--ink-soft)}
.goal-list{list-style:none;text-align:left;margin-top:.5rem}
.goal-list li{display:flex;gap:.6rem;align-items:flex-start;font-weight:700;margin:.45rem 0}.goal-list li .txt{flex:1}
.goal-list .gi{flex:0 0 auto}
.meta-row{display:flex;justify-content:center;gap:.6rem;flex-wrap:wrap;margin:.7rem 0}
.meta-pill{background:rgba(255,255,255,.85);border-radius:999px;padding:.4rem .9rem;font-weight:800;font-size:.85rem;box-shadow:var(--shadow)}

/* Loading screen */
#loader{position:fixed;inset:0;z-index:999;background:linear-gradient(160deg,#4DB8FF,#8FD3FF);display:grid;place-items:center;transition:opacity .6s,visibility .6s}
#loader.gone{opacity:0;visibility:hidden}
#loader .box{text-align:center;color:#fff}
#loader .spinner{width:130px;margin:0 auto;animation:bob 2s ease-in-out infinite}
#loader h2{font-family:var(--display);font-size:1.6rem;margin-top:.6rem;text-shadow:0 2px 6px rgba(0,0,0,.15)}
#loader .bar{width:180px;height:10px;background:rgba(255,255,255,.35);border-radius:999px;margin:.8rem auto 0;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:#fff;border-radius:999px;animation:load 1.6s ease forwards}
@keyframes load{to{width:100%}}

/* Reduced motion & focus */
:focus-visible{outline:3px solid var(--orange-deep);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (min-width:700px){html{font-size:17.5px}.match-grid{grid-template-columns:repeat(4,1fr)}}
@media (prefers-color-scheme:dark){
  body{background:linear-gradient(180deg,#0E2A46 0%,#123B5E 55%,#3A2E14 100%)}
  :root{--card:rgba(20,45,75,.82);--glass:rgba(20,45,75,.55);--ink:#EAF4FF;--ink-soft:#A9C4E4}
  #hud{background:rgba(14,40,66,.7)}
  .opt,.match-tile,.line .say,.check-item,.stop,.verb-pair,.clue,.word-chip,.badge{background:rgba(28,58,92,.92);color:var(--ink)}
  h2.mission-title,.map-info b,.word-title,.match-tile,.badge b{color:#8FD3FF}
  .clue{color:var(--ink)}
  .word-art,.scene-art{background:linear-gradient(145deg,#1C3A5C,#153048)}
  .chip-answer{background:rgba(28,58,92,.5)}
  .rule-box{background:linear-gradient(145deg,#2A2450,#153048);color:var(--ink)}
  .opt.correct,.check-item.on{background:#12402B}
  .opt.wrong{background:#4A1F1F}
  .feedback.good{background:#12402B;color:#8FEDB8}
  .feedback.retry{background:#4A3A12;color:#FFD98A}
  .word-ex{background:rgba(255,224,130,.14)}
  .btn.ghost{background:rgba(28,58,92,.92);color:#8FD3FF}
  .meta-pill{background:rgba(28,58,92,.92);color:#EAF4FF}

/* ============================================================

============================================================ */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } return AC; }
function tone(freq,dur,type,when,vol){
  if(!S.sound) return; const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.18, c.currentTime+(when||0));
  g.gain.exponentialRampToValueAtTime(.001, c.currentTime+(when||0)+dur);
  o.connect(g).connect(c.destination);
  o.start(c.currentTime+(when||0)); o.stop(c.currentTime+(when||0)+dur+.05);
}
const sfx = {
  tap(){ tone(600,.08,'sine',0,.1) },

  bad(){ tone(220,.2,'triangle'); },
  xp(){ tone(880,.08,'square',0,.06); tone(1320,.12,'square',.07,.06) },
  fanfare(){ [523,659,784,1046].forEach((f,i)=>tone(f,.25,'sine',i*.13,.16)) }
};
function speak(text){
  if(!S.sound || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-GB'; u.rate=.85; u.pitch=1.05;
  const v = speechSynthesis.getVoices().find(v=>/en(-|_)GB/i.test(v.lang)) ||
            speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
}

/* Confetti */
const cv=document.getElementById('confetti'), cx=cv.getContext('2d');
let pieces=[], confettiOn=false;
function sizeCanvas(){ cv.width=innerWidth; cv.height=innerHeight; }
addEventListener('resize',sizeCanvas); sizeCanvas();
function confetti(burst){
  const colors=['#4DB8FF','#FFE082','#FFB74D','#4CC98A','#FF8080','#B39DFF','#fff'];
  for(let i=0;i<(burst||120);i++){
    pieces.push({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.4,
      w:6+Math.random()*7, h:8+Math.random()*8, r:Math.random()*Math.PI,
      vy:2+Math.random()*3.2, vx:-1.4+Math.random()*2.8, vr:-.12+Math.random()*.24,
      c:colors[Math.floor(Math.random()*colors.length)]});
  }
  if(!confettiOn){ confettiOn=true; requestAnimationFrame(tick); }
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  pieces.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; });
  pieces=pieces.filter(p=>p.y<cv.height+30);
  pieces.forEach(p=>{ cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cx.restore(); });
  if(pieces.length){ requestAnimationFrame(tick); } else { confettiOn=false; cx.clearRect(0,0,cv.width,cv.height); }
}

============================================================ */
const VOCAB_FLOW = [
  {type:'word', i:0},{type:'word', i:1},{type:'word', i:2},
  {type:'game', id:'match1'},

];
function renderVocab(step){
  setProgress(2);

  if(node.id==='match1') return renderMatchGame(step);

/* Game A — tap-to-match words & pictures */
let matchSel=null, matchLeft=0;
function renderMatchGame(step){
  const trio=[WORDS[0],WORDS[1],WORDS[2]];
  const tiles=[];
  trio.forEach(w=>{ tiles.push({k:w.w, html:ART[w.w], kind:'pic'}); tiles.push({k:w.w, html:w.w, kind:'txt'}); });
  tiles.sort(()=>Math.random()-.5);
  matchSel=null; matchLeft=3;
  show(`
  <span class="eyebrow mint">Mini game · Matching</span>
  ${buddyBlock('excited',`Game time! <b>Match the word to the picture.</b> Tap one, then tap its friend!`)}
  <div class="card">
    <div class="match-grid">
      ${tiles.map((t,idx)=>`<button class="match-tile" data-k="${t.k}" onclick="matchTap(this,${step})">${t.kind==='pic'?t.html:t.html}</button>`).join('')}
    </div>
    <div id="matchFb"></div>
  </div>`);
}
function matchTap(el, step){
  if(el.classList.contains('done')) return;
  sfx.tap();
  if(!matchSel){ matchSel=el; el.classList.add('sel'); return; }
  if(matchSel===el){ el.classList.remove('sel'); matchSel=null; return; }
  if(matchSel.dataset.k===el.dataset.k){
    matchSel.classList.remove('sel');
    matchSel.classList.add('done'); el.classList.add('done');
    sfx.good(); speak(el.dataset.k); matchSel=null; matchLeft--;
    if(matchLeft===0){
      addXP(20); confetti(60);
      document.getElementById('matchFb').innerHTML=`
        <div class="feedback good">🎉 Amazing! You matched them all! +20 XP</div>
        <div class="btn-row"><button class="btn" onclick="sfx.tap();renderVocab(${step+1})">Next words →</button></div>`;
    }
  }else{
    sfx.bad();
    el.classList.add('no'); matchSel.classList.add('no');
    const a=matchSel; matchSel=null;
    setTimeout(()=>{a.classList.remove('no','sel');el.classList.remove('no')},420);
  }
}

    el.parentElement.querySelectorAll('.opt').forEach(o=>{if(o!==el)o.classList.add('dim')});
    document.getElementById('gFb').innerHTML=`<div class="feedback good">🔍 Exactly! You found it!</div>
    <div class="btn-row"><button class="btn" onclick="sfx.tap();renderGrammar(${next})">Next clue →</button></div>`;
  }else{ el.classList.add('wrong'); sfx.bad();
    document.getElementById('gFb').innerHTML=`<div class="feedback retry">🕵️ Hmm, look at the glowing words again. Try once more!</div>`;
    setTimeout(()=>el.classList.remove('wrong'),450);
  }
}

/* ============================================================
   MISSION 5 — MINI PRACTICE (mixed activity types)
============================================================ */
let orderPicked=[], pMatchSel=null, pMatchLeft=0, pFirstTry=true;
function renderPractice(i){
  setProgress(5);
  if(i>=PRACTICE.length) return practiceComplete();
  const q=PRACTICE[i]; pFirstTry=true;
  let body='';
  if(q.type==='mc'){
    body = q.opts.map((o,k)=>`<button class="opt" onclick="pMC(this,${k===q.a?1:0},${i})"><span class="dot">${'ABC'[k]}</span>${o}</button>`).join('');
  }
  else if(q.type==='listen'){
    body = `<div class="btn-row" style="margin:.2rem 0 .6rem"><button class="speak-btn" onclick="speak('${esc(q.word)}')">🔊 Play the word</button></div>` +
      q.opts.map((o,k)=>`<button class="opt" onclick="pMC(this,${k===q.a?1:0},${i})"><span class="dot">${'ABC'[k]}</span>${o}</button>`).join('');
    setTimeout(()=>speak(q.word),600);
  }
  else if(q.type==='match'){
    const tiles=[]; q.pairs.forEach(p=>{tiles.push(p[0]);tiles.push(p[1])});
    tiles.sort(()=>Math.random()-.5);
    pMatchSel=null; pMatchLeft=q.pairs.length;
    body = `<div class="match-grid" style="grid-template-columns:repeat(3,1fr)">
      ${tiles.map(t=>`<button class="match-tile" data-k="${pairKey(q.pairs,t)}" onclick="pMatch(this,${i})">${t}</button>`).join('')}</div>`;
  }
  else if(q.type==='order'){
    orderPicked=[];
    const shuffled=[...q.words].sort(()=>Math.random()-.5);
    body = `<div class="chip-answer" id="ansRow" aria-label="Your sentence"></div>
      <div class="chip-pool" id="poolRow">
        ${shuffled.map(w=>`<button class="word-chip" onclick="pOrder(this,${i})">${w}</button>`).join('')}
      </div>
      <div class="btn-row" style="margin-top:.3rem"><button class="btn ghost" style="font-size:.9rem;padding:.5rem 1.2rem;min-height:44px" onclick="renderPractice(${i})">↺ Reset</button></div>`;
  }
  show(`
  <span class="eyebrow mint">Mission 5 · Mini Practice</span>
  <h2 class="mission-title">🎯 Question ${i+1} of ${PRACTICE.length}</h2>
  ${buddyBlock(i%2?'excited':'happy',`${['You can do it!','Take your time!','Great focus!','Think like a detective!','Almost there!','So close!','Last one — go go go!'][i]}`)}
  <div class="card">
    <p style="font-weight:800;font-size:1.12rem">${q.q}</p>
    ${body}
    <div id="qFb"></div>
  </div>`);
}
function pairKey(pairs,t){ const p=pairs.find(p=>p[0]===t||p[1]===t); return p[0]; }
function pMC(el, ok, i){
  if(ok){ el.classList.add('correct'); sfx.good();
    if(pFirstTry){S.practiceFirstTry++} S.practiceScore++;
    addXP(PRACTICE[i].xp);
    el.parentElement.querySelectorAll('.opt').forEach(o=>{if(o!==el)o.classList.add('dim')});
    document.getElementById('qFb').innerHTML=`<div class="feedback good">${pFirstTry?'🌟 Perfect — first try!':'💚 Yes! You got it!'}</div>
    <div class="btn-row"><button class="btn" onclick="sfx.tap();renderPractice(${i+1})">Next →</button></div>`;
  }else{ pFirstTry=false; el.classList.add('wrong'); sfx.bad();
    document.getElementById('qFb').innerHTML=`<div class="feedback retry">💪 Not yet! Mistakes help our brains grow. Try again!</div>`;
    setTimeout(()=>el.classList.remove('wrong'),450);
  }
}
function pMatch(el, i){
  if(el.classList.contains('done')) return;
  sfx.tap();
  if(!pMatchSel){ pMatchSel=el; el.classList.add('sel'); return; }
  if(pMatchSel===el){ el.classList.remove('sel'); pMatchSel=null; return; }
  if(pMatchSel.dataset.k===el.dataset.k && pMatchSel.textContent!==el.textContent){
    pMatchSel.classList.remove('sel'); pMatchSel.classList.add('done'); el.classList.add('done');
    sfx.good(); pMatchSel=null; pMatchLeft--;
    if(pMatchLeft===0){ S.practiceScore++; if(pFirstTry)S.practiceFirstTry++; addXP(PRACTICE[i].xp);
      document.getElementById('qFb').innerHTML=`<div class="feedback good">🕵️ Detective-level matching!</div>
      <div class="btn-row"><button class="btn" onclick="sfx.tap();renderPractice(${i+1})">Next →</button></div>`; }
  }else{ pFirstTry=false; sfx.bad();
    el.classList.add('no'); pMatchSel.classList.add('no');
    const a=pMatchSel; pMatchSel=null;
    setTimeout(()=>{a.classList.remove('no','sel');el.classList.remove('no')},420);
  }
}
function pOrder(el, i){
  sfx.tap();
  document.getElementById('ansRow').appendChild(el);
  el.onclick=()=>{ sfx.tap(); document.getElementById('poolRow').appendChild(el); el.onclick=()=>pOrder(el,i); checkOrder(i); };
  checkOrder(i);
}
function checkOrder(i){
  const q=PRACTICE[i];
  const chips=[...document.getElementById('ansRow').children].map(c=>c.textContent);
  if(chips.length<q.words.length) return;
  if(chips.join(' ')===q.words.join(' ')){
    S.practiceScore++; if(pFirstTry)S.practiceFirstTry++; sfx.good(); addXP(q.xp);
    document.getElementById('qFb').innerHTML=`<div class="feedback good">🏗️ You built a perfect sentence!</div>
    <div class="btn-row"><button class="btn" onclick="sfx.tap();renderPractice(${i+1})">Next →</button></div>`;
  }else{
    pFirstTry=false; sfx.bad();
    document.getElementById('qFb').innerHTML=`<div class="feedback retry">💪 Hmm, the words are mixed up. Tap a word to put it back, then try again!</div>`;
  }
}
function practiceComplete(){
  const perfect = S.practiceFirstTry===S.practiceTotal;
  if(perfect){ addXP(30); earnBadge('perfect','💎','Perfect Mission','Every answer right on the first try!'); }
  confetti(80);
  show(`
  <div class="hero"><div class="big-buddy">${buddySVG('cheering')}</div></div>
  ${buddyBlock('cheering',`<b>Practice complete!</b> You answered all ${S.practiceTotal} questions! ${perfect?'💎 PERFECT score — bonus +30 XP!':'Great effort — every try makes you stronger! 💪'}`)}
  <div class="btn-row">
    <button class="btn ghost" onclick="sfx.tap();renderRoadmap(5)">See the map 🗺️</button>
    <button class="btn sun" onclick="sfx.tap();renderChallenge()">Mission 6: Weekly Challenge! 🏆</button>
  </div>`);
}

/* ============================================================
   READY FOR CLASS — CHECKLIST
============================================================ */
function renderChecklist(){
  const items=[
    "✏️ I know today's words.",
    "📖 I understand the story.",
    "🕵️ I discovered today's grammar.",
    "🎒 I'm ready for class!"
  ];
  show(`
  <span class="eyebrow mint">Almost done!</span>
  <h2 class="mission-title">✅ Ready for Class?</h2>
  ${buddyBlock('happy',`Last step! <b>Tap each box</b> if it's true for you. Be honest — it's OK to review!`)}
  <div class="card">
    ${items.map((t,i)=>`
      <div class="check-item" role="checkbox" aria-checked="false" tabindex="0" onclick="toggleCheck(this,${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleCheck(this,${i})}">
        <div class="box">✓</div><span>${t}</span>
      </div>`).join('')}
    <div class="btn-row">
      <button class="btn ghost" onclick="sfx.tap();renderVocab(0)">Review words 🧰</button>
      <button class="btn" id="finishBtn" disabled onclick="sfx.tap();renderComplete()">Finish my mission! 🎉</button>
    </div>
  </div>`);
}
function toggleCheck(el, i){
  S.checks[i]=!S.checks[i];
  el.classList.toggle('on', S.checks[i]);
  el.setAttribute('aria-checked', S.checks[i]);
  sfx.tap();
  document.getElementById('finishBtn').disabled = !S.checks.every(Boolean);
  if(S.checks.every(Boolean)) sfx.good();
}
